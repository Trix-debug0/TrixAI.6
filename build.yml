# Place this file at: .github/workflows/build.yml  (repo root)
# Required secret: GEMINI_API_KEY  (Repo -> Settings -> Secrets and variables -> Actions)

name: Build Trix AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Write local.properties
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties
          echo "GEMINI_MODEL=gemini-2.5-flash" >> local.properties

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrixAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
